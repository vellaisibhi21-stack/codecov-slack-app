version: v1
name: codecov-slack-app
traceability:
  mode: warn
release_naming:
  format: semver-v-strict
  mapping: R1
stages:
  planning:
    require_milestone: true
    require_issues_assigned: true
  development:
    branch: master
    deploy_target: dev
    required_checks:
      - Build and Push
    required_reviewers:
      min_approvals: 1
  testing:
    branch_pattern: master
    deploy_target: staging
    deploy_workflow: .github/workflows/staging.yml
    required_checks:
      - Build and Push
    required_reviewers:
      min_approvals: 1
  evidencing:
    required_reviewers:
      min_approvals: 1
  deployment:
    target: production
    deploy_workflow: .github/workflows/production.yml
    required_checks: []
    promotion: manual
    requires_evidence_approval: true
